version: '3.8'

services:
  botzap:
    image: ghcr.io/tvagenciariver/botzap:latest
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL:-postgresql://botzap:da5507d4f8eb04d894ebfe62a494eaf6@postgres:5432/botzap}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-da5507d4f8eb04d894ebfe62a494eaf6}
      - WAHA_BASE_URL=${WAHA_BASE_URL:-http://waha:3000}
      - WAHA_SESSION=${WAHA_SESSION:-default}
      - WAHA_API_KEY=${WAHA_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - WEBHOOK_PUBLIC_URL=${WEBHOOK_PUBLIC_URL:-http://botzap:3001}
    volumes:
      - botzap_data:/app/data
    depends_on:
      - postgres
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # Banco de Dados Relacional PostgreSQL (ACID)
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-botzap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-da5507d4f8eb04d894ebfe62a494eaf6}
      POSTGRES_DB: ${POSTGRES_DB:-botzap}
    volumes:
      - botzap_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # WAHA (Caso já tenha uma WAHA rodando no Portainer, você pode comentar este serviço)
  waha:
    image: devlikeapro/waha:latest
    ports:
      - "3000:3000"
    environment:
      - WHATSAPP_DEFAULT_ENGINE=GOWS
      - WHATSAPP_HOOK_URL=${WHATSAPP_HOOK_URL:-http://botzap:3001/webhook/waha}
      - WHATSAPP_HOOK_EVENTS=message
      - WAHA_APPS_ENABLED=True
      - WAHA_APPS_ON=chatwoot
    volumes:
      - waha_sessions:/app/.sessions
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

volumes:
  botzap_data:
  botzap_postgres_data:
  waha_sessions:
